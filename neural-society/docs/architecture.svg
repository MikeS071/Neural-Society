<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Neural Society architecture</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="998" height="648" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- title -->
  <text x="40" y="44" font-size="20" font-weight="700" fill="#0f172a">Neural Society</text>
  <text x="40" y="66" font-size="13" fill="#64748b">Rust runtime (std only) · tiny verified specialists · shared blackboard · message bus</text>

  <!-- input -->
  <rect x="420" y="88" width="160" height="36" rx="18" fill="#0f172a"/>
  <text x="500" y="111" font-size="14" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">"12*34-5"</text>
  <line x1="500" y1="124" x2="500" y2="152" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- router -->
  <rect x="200" y="154" width="600" height="130" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="220" y="178" font-size="12" font-weight="700" fill="#4338ca" letter-spacing="1">ROUTER · EXACT CODE</text>
  <g font-size="13" text-anchor="middle">
    <rect x="228" y="194" width="160" height="66" rx="10" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="308" y="222" font-weight="600" fill="#1e1b4b">Shunting-yard parser</text>
    <text x="308" y="242" font-size="11.5" fill="#64748b">numbers → operand slots</text>
    <rect x="420" y="194" width="160" height="66" rx="10" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="500" y="222" font-weight="600" fill="#1e1b4b">RPN plan</text>
    <text x="500" y="242" font-size="11.5" fill="#64748b">precedence, parentheses</text>
    <rect x="612" y="194" width="160" height="66" rx="10" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="692" y="222" font-weight="600" fill="#1e1b4b">Long arithmetic</text>
    <text x="692" y="242" font-size="11.5" fill="#64748b">carries, signs, rows</text>
  </g>
  <line x1="388" y1="227" x2="418" y2="227" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="580" y1="227" x2="610" y2="227" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- output -->
  <line x1="200" y1="219" x2="152" y2="219" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="50" y="201" width="100" height="36" rx="18" fill="#0f172a"/>
  <text x="100" y="224" font-size="14" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">403</text>
  <text x="100" y="256" font-size="11.5" fill="#64748b" text-anchor="middle">exact, any length</text>

  <!-- confidence monitor -->
  <line x1="800" y1="219" x2="828" y2="219" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="830" y="180" width="140" height="84" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.3" filter="url(#sh)"/>
  <text x="900" y="204" font-size="12" font-weight="700" fill="#be123c" text-anchor="middle" letter-spacing="0.5">conf &lt; τ</text>
  <text x="900" y="224" font-size="11.5" fill="#475569" text-anchor="middle">log on blackboard</text>
  <text x="900" y="242" font-size="11.5" fill="#475569" text-anchor="middle">optionally escalate</text>
  <text x="900" y="256" font-size="11.5" fill="#475569" text-anchor="middle">to exact code</text>

  <!-- router <-> blackboard -->
  <path d="M 290 286 L 220 336" stroke="#475569" stroke-width="1.6" fill="none" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="268" y="320" font-size="11.5" fill="#475569">read / write slots</text>

  <!-- router <-> backend -->
  <line x1="530" y1="286" x2="530" y2="336" stroke="#475569" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="540" y="308" font-size="11.5" fill="#475569">Message</text>
  <text x="540" y="323" font-size="11" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">op, args → result, conf</text>

  <!-- blackboard -->
  <rect x="40" y="338" width="340" height="206" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="60" y="362" font-size="12" font-weight="700" fill="#b45309" letter-spacing="1">BLACKBOARD · APPEND-ONLY ARENA</text>
  <g font-size="12.5">
    <g transform="translate(60,376)">
      <rect width="300" height="24" rx="6" fill="#ffffff" stroke="#fde68a"/>
      <rect x="6" y="5" width="86" height="14" rx="7" fill="#fef3c7"/><text x="49" y="16" font-size="10.5" fill="#92400e" text-anchor="middle">operand</text>
      <text x="104" y="17" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">12</text>
    </g>
    <g transform="translate(60,404)">
      <rect width="300" height="24" rx="6" fill="#ffffff" stroke="#fde68a"/>
      <rect x="6" y="5" width="86" height="14" rx="7" fill="#fef3c7"/><text x="49" y="16" font-size="10.5" fill="#92400e" text-anchor="middle">operand</text>
      <text x="104" y="17" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">34</text>
    </g>
    <g transform="translate(60,432)">
      <rect width="300" height="24" rx="6" fill="#ffffff" stroke="#fde68a"/>
      <rect x="6" y="5" width="86" height="14" rx="7" fill="#f1f5f9"/><text x="49" y="16" font-size="10.5" fill="#475569" text-anchor="middle">intermediate</text>
      <text x="104" y="17" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">48   <tspan fill="#94a3b8">row 12×4</tspan></text>
    </g>
    <g transform="translate(60,460)">
      <rect width="300" height="24" rx="6" fill="#ffffff" stroke="#fde68a"/>
      <rect x="6" y="5" width="86" height="14" rx="7" fill="#f1f5f9"/><text x="49" y="16" font-size="10.5" fill="#475569" text-anchor="middle">intermediate</text>
      <text x="104" y="17" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">36   <tspan fill="#94a3b8">row 12×3</tspan></text>
    </g>
    <g transform="translate(60,488)">
      <rect width="300" height="24" rx="6" fill="#ffffff" stroke="#fde68a"/>
      <rect x="6" y="5" width="86" height="14" rx="7" fill="#dcfce7"/><text x="49" y="16" font-size="10.5" fill="#166534" text-anchor="middle">step result</text>
      <text x="104" y="17" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">408, 403  <tspan fill="#94a3b8">12×34, then −5</tspan></text>
    </g>
  </g>
  <text x="60" y="532" font-size="11" fill="#92400e">+ step status · low-confidence log · zero allocation after warm-up</text>

  <!-- backend -->
  <rect x="440" y="338" width="180" height="206" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="460" y="362" font-size="12" font-weight="700" fill="#334155" letter-spacing="1">BACKEND</text>
  <g text-anchor="middle">
    <rect x="456" y="376" width="148" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="530" y="402" font-size="13" font-weight="600" fill="#0f172a">Direct call</text>
    <text x="530" y="420" font-size="11.5" fill="#64748b">no threads, no queues</text>
    <text x="530" y="436" font-size="11" fill="#94a3b8">measures pure overhead</text>
    <rect x="456" y="456" width="148" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="530" y="482" font-size="13" font-weight="600" fill="#0f172a">mpsc message bus</text>
    <text x="530" y="500" font-size="11.5" fill="#64748b">1 thread + inbox each</text>
    <text x="530" y="516" font-size="11" fill="#94a3b8">blocking or spin</text>
  </g>

  <!-- backend <-> specialists -->
  <line x1="622" y1="441" x2="658" y2="441" stroke="#475569" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- specialists -->
  <rect x="660" y="338" width="300" height="206" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#sh)"/>
  <text x="680" y="362" font-size="12" font-weight="700" fill="#047857" letter-spacing="1">SPECIALISTS</text>
  <g text-anchor="middle">
    <rect x="676" y="376" width="130" height="62" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="741" y="400" font-size="14" font-weight="700" fill="#064e3b">add</text>
    <text x="741" y="418" font-size="11" fill="#64748b">a+b+carry</text>
    <text x="741" y="432" font-size="10" fill="#94a3b8">6.9K params · 200 inputs</text>
    <rect x="814" y="376" width="130" height="62" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="879" y="400" font-size="14" font-weight="700" fill="#064e3b">sub</text>
    <text x="879" y="418" font-size="11" fill="#64748b">a−b−borrow</text>
    <text x="879" y="432" font-size="10" fill="#94a3b8">6.9K params · 200 inputs</text>
    <rect x="676" y="446" width="130" height="62" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="741" y="470" font-size="14" font-weight="700" fill="#064e3b">mul</text>
    <text x="741" y="488" font-size="11" fill="#64748b">a·b+carry</text>
    <text x="741" y="502" font-size="10" fill="#94a3b8">11.9K params · 900 inputs</text>
    <rect x="814" y="446" width="130" height="62" rx="10" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="879" y="470" font-size="14" font-weight="700" fill="#064e3b">cmp</text>
    <text x="879" y="488" font-size="11" fill="#64748b">&lt;  =  &gt;</text>
    <text x="879" y="502" font-size="10" fill="#94a3b8">5.7K params · 100 inputs</text>
  </g>
  <text x="810" y="530" font-size="11" fill="#047857" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">forward(args) → (class, confidence)</text>

  <!-- offline strip -->
  <rect x="40" y="574" width="920" height="50" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="60" y="604" font-size="12" font-weight="700" fill="#475569" letter-spacing="1">OFFLINE · PYTHON + NUMPY</text>
  <text x="262" y="604" font-size="12.5" fill="#334155">train each specialist on <tspan font-weight="700">every</tspan> possible input  →  verify 100%  →  export <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">weights/*.bin</tspan></text>
  <line x1="810" y1="574" x2="810" y2="548" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ahg)"/>
  <text x="818" y="566" font-size="11" fill="#94a3b8">load</text>
</svg>
